# What Org1's playground explorer publishes. Real deployments start with
# everything hidden and turn on only what the organisation means to share.
# The options are described in docs: Run a network > Run an explorer.
organisation: Org1
channels:
  mychannel:
    level: public
    values: show
    submitter: show
    contracts:
      # Contract approvals and commits are shown to signed-in members only,
      # so the playground has something to sign in for.
      _lifecycle: members
    # Election pages for the ballot contract the playground deploys.
    elections: ballot
    # Each ballot's hash; safe because the contract stores it with the voter's salt.
    privateData: hashes
