# Org2's playground explorer. It reads the same channel from Org2's own peer,
# but publishes less than Org1's: no submitters, and asset values only to
# signed-in members. The two compare signed checkpoints and agree all the same.
organisation: Org2
channels:
  mychannel:
    level: public
    values: show
    submitter: hide
    contracts:
      basic: members
    elections: ballot
  members:
    # Only for signed-in members of the channel: try signing in on the explorer
    # or on the network page.
    level: members
