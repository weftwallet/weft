<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Weft" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Drawn on the 16px pixel grid so every thread and gap lands on whole pixels.
       Two warps, two wefts, alternating over and under. Use at 32px and below. -->
  <rect width="16" height="16" rx="4" fill="#3FC1B0"/>
  <rect x="4" y="2" width="2" height="12" fill="#0B1218"/>
  <rect x="10" y="2" width="2" height="12" fill="#0B1218"/>
  <rect x="2" y="4" width="12" height="2" fill="#0B1218"/>
  <rect x="2" y="10" width="12" height="2" fill="#0B1218"/>
  <rect x="9" y="3" width="4" height="4" fill="#3FC1B0"/>
  <rect x="10" y="3" width="2" height="4" fill="#0B1218"/>
  <rect x="3" y="9" width="4" height="4" fill="#3FC1B0"/>
  <rect x="4" y="9" width="2" height="4" fill="#0B1218"/>
  <rect x="3" y="3" width="4" height="4" fill="#3FC1B0"/>
  <rect x="3" y="4" width="4" height="2" fill="#0B1218"/>
  <rect x="9" y="9" width="4" height="4" fill="#3FC1B0"/>
  <rect x="9" y="10" width="4" height="2" fill="#0B1218"/>
</svg>
