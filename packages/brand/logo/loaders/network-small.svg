<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Weft Network's small loader, on the 16px grid: its pick moves a pixel at a time. Generated by scripts/loaders.mjs. -->
  <style>.weft-loader-network-small{animation:weft-loader-network-small 1600ms infinite}@keyframes weft-loader-network-small{0%{transform:translateX(-13px);animation-timing-function:steps(13, end)}42%{transform:translateX(0);animation-timing-function:steps(13, end)}76%,100%{transform:translateX(13px)}}</style>
  <rect width="16" height="16" rx="4" fill="#3FC1B0"/><rect x="1" y="1" width="14" height="14" rx="3" fill="#0B1218"/>
  <g shape-rendering="crispEdges">
  <rect x="3" y="2" width="2" height="12" fill="#3FC1B0"/><rect x="7" y="2" width="2" height="12" fill="#3FC1B0"/><rect x="11" y="2" width="2" height="12" fill="#3FC1B0"/>
  
  <svg x="2" y="0" width="12" height="16" viewBox="2 0 12 16"><g class="weft-loader-network-small"><rect x="2" y="6" width="12" height="4" fill="#0B1218"/><rect x="2" y="7" width="12" height="2" fill="#3FC1B0"/></g></svg>
  <rect x="6" y="6" width="4" height="4" fill="#0B1218"/><rect x="7" y="6" width="2" height="4" fill="#3FC1B0"/>
  </g>
</svg>
