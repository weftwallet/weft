<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
  <!-- Weft Playground's small loader, on the 16px grid: its pick moves a pixel at a time. Generated by scripts/loaders.mjs. -->
  <style>.weft-loader-playground-small{animation:weft-loader-playground-small 1600ms infinite}@keyframes weft-loader-playground-small{0%{transform:translateX(-7px);animation-timing-function:steps(7, end)}42%{transform:translateX(0)}62%{transform:translateX(0);animation-timing-function:steps(13, end)}96%,100%{transform:translateX(13px)}}</style>
  <rect width="16" height="16" rx="4" fill="#3FC1B0"/>
  <g shape-rendering="crispEdges">
  <rect x="4" y="2" width="2" height="12" fill="#0B1218"/><rect x="10" y="2" width="2" height="12" fill="#0B1218"/>
  <rect x="2" y="3" width="12" height="4" fill="#3FC1B0"/><rect x="2" y="4" width="12" height="2" fill="#0B1218"/><rect x="9" y="3" width="4" height="4" fill="#3FC1B0"/><rect x="10" y="3" width="2" height="4" fill="#0B1218"/>
  <svg x="2" y="0" width="12" height="16" viewBox="2 0 12 16"><g class="weft-loader-playground-small"><rect x="2" y="9" width="6" height="4" fill="#3FC1B0"/><rect x="2" y="10" width="6" height="2" fill="#0B1218"/></g></svg>
  <rect x="3" y="9" width="4" height="4" fill="#3FC1B0"/><rect x="4" y="9" width="2" height="4" fill="#0B1218"/>
  </g>
</svg>
