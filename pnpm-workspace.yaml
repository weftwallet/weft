packages:
  - "packages/*"
  - "apps/*"
  - "e2e"

# pnpm <script> refuses to run when node_modules is older than pnpm-lock.yaml,
# and says to run pnpm install. It never installs by itself.
verifyDepsBeforeRun: error

onlyBuiltDependencies:
  - esbuild
  - sharp
  - spawn-sync

# fabric-gateway's optional HSM support (pkcs11js) is not used by the relay.
ignoredBuiltDependencies:
  - pkcs11js
  - protobufjs
